<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Running Milestones · 2026</title>
  <meta name="description" content="Sarthak Jain — 2026 running milestones, consistency and goals." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 42 59" aria-hidden="true">
        <path d="M29.2706 43.5683L24.1528 33.4854L16.5283 33.4982L29.2706 58.4349L41.9999 33.4854H34.3754L29.2706 43.5683Z" fill="currentColor"/>
        <path d="M17.1812 19.9467L24.1529 33.4852H34.3755L17.1812 0L0 33.4852H10.2356L17.1812 19.9467Z" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <h1>Running Milestones</h1>
        <p class="subtitle">2026 season · <span id="data-as-of">loading…</span></p>
      </div>
    </div>
    <div class="header-actions">
      <button id="theme-btn" class="ghost-btn" type="button" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main>
    <!-- 2026 overview stats -->
    <section id="overview">
      <div id="overview-status" class="status-msg">Loading your 2026 runs…</div>
      <div id="hero-stats" class="hero-stats" hidden></div>
    </section>

    <!-- Milestones -->
    <section class="section-block" id="milestone-section" hidden>
      <h2 class="section-title">2026 Milestones</h2>
      <div id="milestone-grid" class="milestone-grid"></div>
    </section>

    <!-- Consistency -->
    <section class="section-block" id="consistency-section" hidden>
      <h2 class="section-title">Consistency</h2>
      <div id="streak-card" class="streak-card" hidden></div>
      <div id="heatmap-wrap" class="heatmap-wrap" hidden>
        <div class="heatmap-head">
          <span class="heatmap-title">Run days · 2026 <span class="heatmap-hint">km per day</span></span>
          <div class="heatmap-legend">
            <span class="legend-item"><span class="legend-cell lv1"></span>&lt;8k</span>
            <span class="legend-item"><span class="legend-cell lv2"></span>8–12k</span>
            <span class="legend-item"><span class="legend-cell lv3"></span>12k+</span>
          </div>
        </div>
        <div class="heatmap-scroll">
          <div class="heatmap-inner">
            <div class="heatmap-months-row">
              <div class="heatmap-months-spacer"></div>
              <div id="heatmap-months" class="heatmap-months"></div>
            </div>
            <div class="heatmap-grid">
              <div class="heatmap-daylabels">
                <span style="top:calc(var(--hm-step,15px)*0)">M</span><span style="top:calc(var(--hm-step,15px)*1)">T</span><span style="top:calc(var(--hm-step,15px)*2)">W</span><span style="top:calc(var(--hm-step,15px)*3)">T</span><span style="top:calc(var(--hm-step,15px)*4)">F</span><span style="top:calc(var(--hm-step,15px)*5)">S</span><span style="top:calc(var(--hm-step,15px)*6)">S</span>
              </div>
              <div id="heatmap" class="heatmap"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Distance trends -->
    <section class="section-block" id="trends-section" hidden>
      <h2 class="section-title">Distance Trends</h2>
      <div class="chart-grid">
        <div class="chart-card">
          <h3>Km by month</h3>
          <div id="monthly-chart" class="chart"></div>
        </div>
        <div class="chart-card">
          <h3>Km by week</h3>
          <div id="weekly-chart" class="chart"></div>
          <p id="best-week" class="best-week"></p>
        </div>
      </div>
    </section>

    <!-- Personal records -->
    <section class="section-block" id="pr-section" hidden>
      <h2 class="section-title">Personal Records</h2>
      <div id="pr-grid" class="pr-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="https://www.strava.com/athletes/107463593" target="_blank" rel="noopener noreferrer">Strava profile ↗</a>
  </footer>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
