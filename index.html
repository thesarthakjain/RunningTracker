<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Running Milestones</title>
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text: #171717;
      --muted: #737373;
      --border: #e5e5e5;
      --strava: #fc4c02;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --card-bg: #141414;
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --border: #262626;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 3rem 1.25rem;
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .section-block {
      margin-bottom: 3rem;
    }

    .section-block:last-of-type {
      margin-bottom: 0;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s ease;
    }

    .section-title:hover {
      color: var(--strava);
    }

    .section-title .chevron {
      font-size: 0.65rem;
      transition: transform 0.2s ease, color 0.15s ease;
    }

    .section-title:hover .chevron {
      color: var(--strava);
    }

    .section-title.all-open .chevron {
      transform: rotate(90deg);
    }

    .status-msg {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .timeline {
      position: relative;
      border-left: 2px solid var(--border);
      margin-left: 0.5rem;
      padding-left: 1.75rem;
    }

    /* Dashed line for future planned runs */
    .timeline.future-timeline {
      border-left-style: dashed;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 2.25rem;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -2.15rem;
      top: 0.35rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--bg);
      border: 2px solid var(--strava);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .future-timeline .timeline-dot {
      border-color: var(--muted);
    }

    .timeline-item.open .timeline-dot {
      background-color: var(--strava);
      border-color: var(--strava);
    }

    .item-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .item-title-group {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: baseline;
      gap: 0.65rem;
    }

    .item-date {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .item-title-group:hover .item-title {
      color: var(--strava);
    }

    .chevron {
      font-size: 0.75rem;
      color: var(--muted);
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .timeline-item.open .chevron {
      transform: rotate(90deg);
    }

    .strava-link,
    .planned-badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }

    .strava-link {
      color: var(--strava);
      transition: border-color 0.15s ease;
    }

    .strava-link:hover {
      border-color: var(--strava);
    }

    .planned-badge {
      color: var(--muted);
      font-weight: 500;
    }

    .item-details {
      display: none;
      margin-top: 0.75rem;
      padding: 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
    }

    .timeline-item.open .item-details {
      display: block;
    }

    .item-description {
      color: var(--text);
      white-space: pre-line;
    }

    /* Goals layout for Future Tracker */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
    }

    .goal-box {
      padding: 0.65rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg);
    }

    .goal-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--strava);
      margin-bottom: 0.2rem;
    }

    .goal-value {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
    }

    .embed-container {
      margin-top: 1rem;
      overflow-x: auto;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .media-grid:empty {
      display: none;
    }

    .media-card {
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .media-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .media-label {
      font-size: 0.7rem;
      color: var(--muted);
      padding: 0.3rem 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Running Milestones</h1>
    <p>Tap any milestone or section header to expand targets, notes, race bibs, and medals.</p>
  </header>

  <!-- Section 1: Future Runs / Milestones Planned -->
  <section class="section-block" id="future-section">
    <h2 id="future-heading" class="section-title" title="Click to expand or collapse all">
      <span class="chevron">&#9654;</span> Upcoming Targets
    </h2>
    <div id="future-status" class="status-msg">Loading upcoming runs...</div>
    <div id="future-timeline" class="timeline future-timeline" style="display: none;"></div>
  </section>

  <!-- Section 2: Completed Milestones -->
  <section class="section-block" id="past-section">
    <h2 id="past-heading" class="section-title" title="Click to expand or collapse all">
      <span class="chevron">&#9654;</span> Completed Milestones
    </h2>
    <div id="past-status" class="status-msg">Loading milestones...</div>
    <div id="past-timeline" class="timeline" style="display: none;"></div>
  </section>

  <script>
    const SHEET_ID = "1YRHuUMLQ0J7Nhu76l6jzs8XJykrZYbEc68CJCzuAS1s";
    const FUTURE_TAB = "Future Tracker";
    const PAST_TAB = "Past tracker";
    const IMAGE_FOLDER = "./images";

    const FUTURE_URL = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(FUTURE_TAB)}`;
    const PAST_URL = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(PAST_TAB)}`;

    // Syncs the section headline's chevron rotation based on whether all items are open
    function syncSectionHeading(timelineEl, headingEl) {
      const items = Array.from(timelineEl.querySelectorAll(".timeline-item"));
      const allOpen = items.length > 0 && items.every(item => item.classList.contains("open"));
      headingEl.classList.toggle("all-open", allOpen);
    }

    // Makes the section headline expand all items if any are closed, or collapse all if all are open
    function setupHeadingToggle(timelineEl, headingEl) {
      headingEl.addEventListener("click", () => {
        const items = Array.from(timelineEl.querySelectorAll(".timeline-item"));
        if (!items.length) return;

        const shouldExpand = items.some(item => !item.classList.contains("open"));

        items.forEach(item => {
          if (shouldExpand) {
            item.classList.add("open");
            if (typeof item._loadContent === "function") {
              item._loadContent();
            }
          } else {
            item.classList.remove("open");
          }
        });

        syncSectionHeading(timelineEl, headingEl);
      });
    }

    async function loadFutureTimeline() {
      const statusEl = document.getElementById("future-status");
      const timelineEl = document.getElementById("future-timeline");
      const headingEl = document.getElementById("future-heading");

      try {
        const res = await fetch(FUTURE_URL);
        if (!res.ok) throw new Error("Failed to fetch future sheet data");
        const rows = await res.json();

        const validRows = rows.filter(r => (r["Achievement"] || "").trim() !== "");

        if (!validRows.length) {
          statusEl.textContent = "No upcoming targets scheduled right now.";
          return;
        }

        validRows.forEach(row => {
          const date = (row["Date"] || "").trim();
          const title = (row["Achievement"] || "").trim();
          const goalA = (row["Goal A"] || "").trim();
          const goalB = (row["Goal B"] || "").trim();

          const item = document.createElement("div");
          item.className = "timeline-item";

          const dot = document.createElement("div");
          dot.className = "timeline-dot";
          item.appendChild(dot);

          const header = document.createElement("div");
          header.className = "item-header";

          const titleGroup = document.createElement("div");
          titleGroup.className = "item-title-group";
          titleGroup.innerHTML = `
            <span class="chevron">&#9654;</span>
            <span class="item-date">${escapeHtml(date)}</span>
            <span class="item-title">${escapeHtml(title)}</span>
          `;
          header.appendChild(titleGroup);

          const badge = document.createElement("span");
          badge.className = "planned-badge";
          badge.textContent = "Planned";
          header.appendChild(badge);

          item.appendChild(header);

          const details = document.createElement("div");
          details.className = "item-details";

          const goalsGrid = document.createElement("div");
          goalsGrid.className = "goals-grid";

          if (goalA) {
            goalsGrid.innerHTML += `
              <div class="goal-box">
                <div class="goal-label">Goal A</div>
                <div class="goal-value">${escapeHtml(goalA)}</div>
              </div>
            `;
          }

          if (goalB) {
            goalsGrid.innerHTML += `
              <div class="goal-box">
                <div class="goal-label">Goal B</div>
                <div class="goal-value">${escapeHtml(goalB)}</div>
              </div>
            `;
          }

          if (!goalA && !goalB) {
            goalsGrid.innerHTML = `<p class="item-description">Targets to be finalized.</p>`;
          }

          details.appendChild(goalsGrid);
          item.appendChild(details);

          titleGroup.addEventListener("click", () => {
            item.classList.toggle("open");
            syncSectionHeading(timelineEl, headingEl);
          });

          timelineEl.appendChild(item);
        });

        statusEl.style.display = "none";
        timelineEl.style.display = "block";
        setupHeadingToggle(timelineEl, headingEl);
      } catch (err) {
        statusEl.textContent = "Unable to load upcoming runs. Check tab name 'Future Tracker'.";
        console.error(err);
      }
    }

    async function loadPastTimeline() {
      const statusEl = document.getElementById("past-status");
      const timelineEl = document.getElementById("past-timeline");
      const headingEl = document.getElementById("past-heading");

      try {
        const res = await fetch(PAST_URL);
        if (!res.ok) throw new Error("Failed to fetch past sheet data");
        const rows = await res.json();

        const validRows = rows.filter(r => (r["Achievement"] || "").trim() !== "");

        if (!validRows.length) {
          statusEl.textContent = "No milestones recorded yet.";
          return;
        }

        // Newest to oldest
        validRows.reverse().forEach(row => {
          const id = (row["ID"] || "").trim();
          const date = (row["Date"] || "").trim();
          const title = (row["Achievement"] || "").trim();
          const desc = (row["Description"] || "").trim();
          const stravaUrl = (row["Strava"] || "").trim();
          const embedCode = (row["Embed Code"] || "").trim();

          const item = document.createElement("div");
          item.className = "timeline-item";

          const dot = document.createElement("div");
          dot.className = "timeline-dot";
          item.appendChild(dot);

          const header = document.createElement("div");
          header.className = "item-header";

          const titleGroup = document.createElement("div");
          titleGroup.className = "item-title-group";
          titleGroup.innerHTML = `
            <span class="chevron">&#9654;</span>
            <span class="item-date">${escapeHtml(date)}</span>
            <span class="item-title">${escapeHtml(title)}</span>
          `;

          header.appendChild(titleGroup);

          if (stravaUrl) {
            const stravaBtn = document.createElement("a");
            stravaBtn.className = "strava-link";
            stravaBtn.href = stravaUrl;
            stravaBtn.target = "_blank";
            stravaBtn.rel = "noopener noreferrer";
            stravaBtn.textContent = "Strava ↗";
            header.appendChild(stravaBtn);
          }

          item.appendChild(header);

          const details = document.createElement("div");
          details.className = "item-details";

          if (desc) {
            const descP = document.createElement("p");
            descP.className = "item-description";
            descP.textContent = desc;
            details.appendChild(descP);
          }

          let embedLoaded = false;
          const embedContainer = document.createElement("div");
          embedContainer.className = "embed-container";
          details.appendChild(embedContainer);

          let mediaLoaded = false;
          const mediaGrid = document.createElement("div");
          mediaGrid.className = "media-grid";
          details.appendChild(mediaGrid);

          item.appendChild(details);

          // Lazy-loads media & embeds when opened individually or via the section headline
          item._loadContent = () => {
            if (!mediaLoaded && id) {
              mediaLoaded = true;
              probeAndAttachImage(id, "bib", "Race Bib", mediaGrid);
              probeAndAttachImage(id, "medal", "Medal", mediaGrid);
            }
            if (!embedLoaded && embedCode) {
              embedLoaded = true;
              injectEmbedCode(embedCode, embedContainer);
            }
          };

          titleGroup.addEventListener("click", () => {
            const isOpen = item.classList.toggle("open");
            if (isOpen) {
              item._loadContent();
            }
            syncSectionHeading(timelineEl, headingEl);
          });

          timelineEl.appendChild(item);
        });

        statusEl.style.display = "none";
        timelineEl.style.display = "block";
        setupHeadingToggle(timelineEl, headingEl);
      } catch (err) {
        statusEl.textContent = "Unable to load milestones. Check Sheet ID & sharing permissions.";
        console.error(err);
      }
    }

    function probeAndAttachImage(id, type, label, container) {
      const extensions = ["jpg", "jpeg", "png", "webp"];

      function tryNext(index) {
        if (index >= extensions.length) return;
        const ext = extensions[index];
        const img = new Image();
        img.src = `${IMAGE_FOLDER}/${id}-${type}.${ext}`;
        img.alt = `${label} #${id}`;

        img.onload = () => {
          const card = document.createElement("div");
          card.className = "media-card";
          card.innerHTML = `<div class="media-label">${label}</div>`;
          card.prepend(img);
          container.appendChild(card);
        };

        img.onerror = () => tryNext(index + 1);
      }

      tryNext(0);
    }

    function injectEmbedCode(htmlString, container) {
      container.innerHTML = htmlString;
      const scripts = container.querySelectorAll("script");
      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach(attr =>
          newScript.setAttribute(attr.name, attr.value)
        );
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    // Load both sections in parallel
    loadFutureTimeline();
    loadPastTimeline();
  </script>
</body>
</html>
